name: 1 朝の準備（毎朝4:00）
# cron は UTC で書く決まりです。UTC 19:00 = 日本時間 翌朝 4:00。
# 6:00 の枠まで2時間あるので、ネタの取り込み・案の作成・確認待ちの Issue の作成が、間に合います。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: x-jidou-unyou
  cancel-in-progress: false
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 朝の準備（数字を取る・ネタを取り込む・3本作って確かめる）
        run: python -m xjido morning
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
      - name: 記録を保存する（data/ メモリ/）
        if: always()
        run: |
          git config user.name "x-jidou-unyou"
          git config user.email "actions@users.noreply.github.com"
          git add data メモリ
          if git diff --cached --quiet; then echo "保存する変更はありません"; else
            git commit -m "自動：記録の更新"
            git pull --rebase
            git push
          fi
