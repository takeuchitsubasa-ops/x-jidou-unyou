name: 3 週の分析（毎週日曜の夜）
# UTC 12:00 の日曜 = 日本時間 日曜の21:00。
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: x-jidou-unyou
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 週の分析（伸びる型を書き直す）
        run: python -m xjido weekly
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
      - name: 記録を保存する（data/ メモリ/）
        if: always()
        run: |
          git config user.name "x-jidou-unyou"
          git config user.email "actions@users.noreply.github.com"
          git add data メモリ
          if git diff --cached --quiet; then echo "保存する変更はありません"; else
            git commit -m "自動：記録の更新"
            git pull --rebase
            git push
          fi
