# 設定.yml
# ここを書き換えると、動きが変わります。GitHub の画面（鉛筆のマーク）やスマホからも直せます。
# 書き方：「項目: 値」。# から後ろはメモです。

アカウント名: your_account   # あなたの X のアカウント名（@ は付けない）

投稿:
  時刻: ["06:00", "12:00", "18:00"]   # 日本時間。時刻の数が、1日の本数になります
  スレッドの長さ: 3                    # 1つのスレッドの投稿数（つかみ→本文→まとめ）
  1投稿の最大文字数: 280               # X Premium に入っていなければ 280（日本語は1文字を2と数えるので、全角140字）。Premium なら増やせます
  遅れの許容_分: 180                   # 実行が遅れた時、予定の時刻からこの分数までは投稿する
  まとめるの最大_1日: 1                # 「まとめると」で締めるスレッドは、1日にここまで

確認:
  方式: 止まった時だけ確認   # 「止まった時だけ確認」「全部確認する」「止まった案は捨てる」から選ぶ。説明は README の「確認待ちの見方」
  確認待ちの最大件数_1日: 3
  AIで二重に確かめる: true
  OKラベル: OK
  予備の案の数: 2          # 確認で止まった時の代わりに、多めに作っておく案の数

AI:
  提供元: anthropic            # anthropic（Claude API）／ claude-cli（手元の claude コマンド）／ file（開発用：依頼をファイルに書き出し、返事のファイルを読む）
  モデル: claude-sonnet-5-5    # 案を作るモデル。claude-opus-5-5 / claude-sonnet-5-5 / claude-haiku-5-5
  確認用のモデル: claude-sonnet-5-5
  分析のモデル: claude-sonnet-5-5

数字を取る:
  日数: 3          # 毎朝、直近の何日分の自分の投稿と数字を取るか
  最大件数: 60

分析:
  日数: 14         # 毎週日曜の分析で、何日分を見るか
  最大件数: 200
